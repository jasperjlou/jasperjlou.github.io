name: Third-round dependency audit
on:
  push:
    branches: [agent/tinacms-security-migration-20261017]
    paths: [.github/workflows/audit-round3-probe.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Preserve source and baseline
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/revision.txt
          git archive --format=zip --output=evidence/source.zip HEAD AGENTS.md package.json package-lock.json astro.config.mjs src tina scripts .github
          npm ci --ignore-scripts
          set +e
          npm audit --json > evidence/audit-before.json
          echo "$?" > evidence/audit-before.exit
          npm ls --all --json > evidence/tree-before.json
          echo "$?" > evidence/tree-before.exit
          set -e
      - name: Record current upstream fixes and compatibility constraints
        run: |
          node --input-type=module <<'JS' > evidence/registry.json
          const out={};
          for(const name of ['@graphql-tools/utils','katex','react-router','react-router-dom','braces','sprintf-js','postcss-selector-parser','tinacms','@tinacms/cli','@tinacms/astro']){
            const r=await fetch(`https://registry.npmjs.org/${encodeURIComponent(name)}`);if(!r.ok)throw Error(`${name}: ${r.status}`);
            const d=await r.json(),v=d['dist-tags'].latest,p=d.versions[v];
            out[name]={version:v,published:d.time[v],dependencies:p.dependencies,peerDependencies:p.peerDependencies,engines:p.engines};
          }
          console.log(JSON.stringify(out,null,2));
          JS
          cat evidence/registry.json
      - name: Probe only semver-compatible fixes
        shell: bash
        run: |
          set +e
          npm audit fix --package-lock-only --ignore-scripts --json > evidence/compatible-fix.json
          echo "$?" > evidence/compatible-fix.exit
          set -e
          git diff --exit-code -- package.json
          npm ci
          cp package-lock.json evidence/candidate-package-lock.json
          set +e
          npm audit --json > evidence/audit-after.json
          echo "$?" > evidence/audit-after.exit
          npm ls --all --json > evidence/tree-after.json
          echo "$?" > evidence/tree-after.exit
          set -e
          git diff --stat > evidence/changes.txt
          node -e "for(const p of ['before','after']){const a=require('./evidence/audit-'+p+'.json'); if(!a.metadata)throw Error('Audit unavailable'); console.log(p,a.metadata.vulnerabilities)}"
      - name: Validate compatible candidate
        run: |
          npm audit --omit=dev --audit-level=high
          npm run build 2>&1 | tee evidence/build.log
          npm run check 2>&1 | tee evidence/check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round3-website-probe
          path: evidence/
          retention-days: 7
          if-no-files-found: error
