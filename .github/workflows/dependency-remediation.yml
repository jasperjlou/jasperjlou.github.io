name: Apply validated dependency remediation
on:
  push:
    branches: [agent/tinacms-security-migration-20261017]
    paths: [.github/workflows/dependency-remediation.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Refuse changes to the source that passed complete validation
        env:
          VALIDATED_SHA: e5646712fc4372ef94c95a3676dea1684772c844
        run: |
          test "$(git rev-parse HEAD^)" = "$VALIDATED_SHA"
          git diff --exit-code "$VALIDATED_SHA" HEAD -- . ':(exclude).github/workflows/dependency-remediation.yml'
      - name: Retrieve the immutable validated artifact and verify its ZIP digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api /repos/jasperjlou/jasperjlou.github.io/actions/artifacts/12089443224/zip > "$RUNNER_TEMP/candidate.zip"
          echo "ec5d0b0daf86413a63e56d7f36f4fe766b81cb12cc6f53d7b216e86856e19661  $RUNNER_TEMP/candidate.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/candidate"
          unzip -q "$RUNNER_TEMP/candidate.zip" -d "$RUNNER_TEMP/candidate"
      - name: Apply only validated dependencies and independently verify installed patch sources
        run: |
          for p in package.json package-lock.json tina/tina-lock.json; do cp "$RUNNER_TEMP/candidate/$p" "$p"; done
          test ! -e vendor/braces
          cp -R "$RUNNER_TEMP/candidate/vendor" ./
          echo '8499bc8766827be7371f5d493787f290b73f27256c4e7e480ef0ad93f29f5d99  package.json' | sha256sum --check
          echo '853d3acadabdc685dac5bb406465d015af64f93f377d818b197d1d56b80bd03f  package-lock.json' | sha256sum --check
          echo '16052e9482c3fb7f38cdba7024e46a9832b39bbc05e4ec602aae26b8a958b4cf  tina/tina-lock.json' | sha256sum --check
          npm ci --ignore-scripts
          npm run security:vendor
          npm audit
      - name: Commit the exact tested source without changing production or workflow permissions
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add package.json package-lock.json tina/tina-lock.json vendor
          # Preserve upstream EOF bytes and required leading spaces in unified-diff
          # context lines. All other source whitespace checks remain enforced.
          git -c core.whitespace=-blank-at-eof diff --cached --check -- . ':(exclude)vendor/*/security.patch'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: align security-fixed GraphQL and editor dependencies with reviewed source patches'
          git push origin "HEAD:$TARGET_BRANCH"
