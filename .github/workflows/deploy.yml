name: Deploy Hexo

on:
  push:
    branches:
      - source
    paths:
      - '_config.yml'
      - '_config.landscape.yml'
      - 'source/**'
      - 'scaffolds/**'
      - 'themes/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hexo-pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build site
        run: npm run build

      - name: Remove unused theme assets
        run: rm -rf public/fancybox

      - name: Skip Jekyll processing
        run: touch public/.nojekyll

      - name: Deploy generated site to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --branch main --single-branch "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
          rsync -a --delete --exclude '.git' public/ deploy/
          cd deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to deploy."
            exit 0
          fi
          git commit -m "Deploy site from ${GITHUB_SHA}"
          git push origin main
