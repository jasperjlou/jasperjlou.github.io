name: Deploy Astro to GitHub Pages

on:
  push:
    branches:
      - source
  workflow_dispatch:
    inputs:
      restore_snapshot:
        description: Restore verified pre-cutover public snapshot (candidate branches only rehearse)
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !inputs.restore_snapshot }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: |
          npm audit
          npm run security:vendor

      - name: Test production build guards
        run: node --test scripts/test-cloud-build.mjs

      - name: Build site and TinaCMS editor
        env:
          GITHUB_BRANCH: source
          PUBLIC_TINA_CLIENT_ID: ${{ vars.PUBLIC_TINA_CLIENT_ID || secrets.PUBLIC_TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
        shell: bash
        run: npm run build:cloud

      - name: Validate content and types
        run: npm run check

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist/client

  restore:
    if: ${{ inputs.restore_snapshot }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download preserved snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download recovery-public-20261018 --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/snapshot" --pattern 'site-*'
      - name: Verify hashes and restore static files
        run: python3 scripts/restore-pages-snapshot.py "$RUNNER_TEMP/snapshot" dist/client
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload restored Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist/client

  deploy:
    # A manual run on a candidate branch validates its artifact without publishing it.
    if: ${{ always() && github.ref == 'refs/heads/source' && (needs.build.result == 'success' || needs.restore.result == 'success') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, restore]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
