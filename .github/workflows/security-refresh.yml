name: One-time dependency security refresh

on:
  push:
    branches:
      - source
    paths:
      - '.github/workflows/security-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          ref: source

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply safe audit fixes
        run: npm audit fix || true

      - name: Verify build
        run: npm run build

      - name: Commit dependency fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes were needed."
          else
            git commit -m "Apply npm security fixes"
            git push origin HEAD:source
          fi

      - name: Verify no high-severity audit findings remain
        run: npm audit --audit-level=high
