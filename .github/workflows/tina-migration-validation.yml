name: Tina migration validation

on:
  push:
    branches: [agent/tinacms-security-migration-20261017]
  pull_request:
    branches: [source]

permissions:
  contents: read

concurrency:
  group: tina-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install exact committed dependencies
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/revision.txt
          npm ci
      - name: Preserve production security gate and record full audit separately
        shell: bash
        run: |
          npm audit --omit=dev --audit-level=high
          set +e
          npm audit --json > evidence/audit-full.json
          status=$?
          set -e
          echo "$status" > evidence/audit-full.exit
          node -e "const a=require('./evidence/audit-full.json'); if(!a.metadata)throw Error('Audit unavailable'); console.log(a.metadata); if(a.metadata.vulnerabilities.critical)process.exit(1); const cli=a.vulnerabilities['@tinacms/cli']; if(cli && cli.via.some(v=>typeof v==='object'&&v.url.includes('GHSA-pwhx-cvv3-qj5c')))throw Error('Branch injection advisory remains');"
      - name: Build and type-check
        run: |
          npm run build 2>&1 | tee evidence/build.log
          npm run check 2>&1 | tee evidence/check.log
      - name: Verify required public artifacts
        run: |
          for p in index.html projects/cuhksz-microworld/index.html projects/holistic-assistant/index.html projects/market-watchdog/index.html projects/ai-sync/index.html 2026/02/26/holistic-assistant-setback/index.html admin/index.html CNAME rss.xml sitemap-index.xml robots.txt; do test -f "dist/client/$p"; done
          grep -q 'jasperjlou.me' dist/client/CNAME
          grep -q '<html lang="en">' dist/client/index.html
          grep -q '<link rel="canonical" href="https://jasperjlou.me/' dist/client/index.html
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/tina-browser" --ignore-scripts --no-audit --no-fund playwright@1.64.1
          "$RUNNER_TEMP/tina-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exercise local editor entry and inspect collection controls
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {spawn} from 'node:child_process';
          import {pathToFileURL} from 'node:url';
          const {chromium}=await import(pathToFileURL(`${process.env.RUNNER_TEMP}/tina-browser/node_modules/playwright/index.mjs`).href);
          const fd=fs.openSync('evidence/dev.log','w');
          const child=spawn('npm',['run','dev'],{detached:true,stdio:['ignore',fd,fd]});
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          const errors=[];page.on('pageerror',e=>errors.push(e.message));
          async function snapshot(name){
            await page.waitForTimeout(2000);
            const data={url:page.url(),text:await page.locator('body').innerText(),errors:[...errors],links:await page.getByRole('link').evaluateAll(a=>a.map(x=>({text:x.textContent,href:x.getAttribute('href')}))),buttons:await page.getByRole('button').allTextContents(),fields:await page.locator('input,textarea').evaluateAll(a=>a.map(x=>({tag:x.tagName,type:x.type,name:x.name,placeholder:x.placeholder,value:x.value})))};
            fs.writeFileSync(`evidence/${name}.json`,JSON.stringify(data,null,2));
            await page.screenshot({path:`evidence/${name}.png`,fullPage:true});
          }
          try{
            let ready=false;
            for(let i=0;i<90;i++){try{if((await fetch('http://localhost:4321/')).ok){ready=true;break;}}catch{}await new Promise(r=>setTimeout(r,1000));}
            if(!ready)throw Error('Local dev server unavailable');
            await page.goto('http://localhost:4321/admin/index.html',{waitUntil:'domcontentloaded'});
            await page.getByRole('button',{name:'Enter Edit Mode',exact:true}).click({timeout:30000});
            await snapshot('editor-entered');
            await page.goto('http://localhost:4321/admin/index.html#/collections/home',{waitUntil:'domcontentloaded'});
            await snapshot('home-collection');
            const edit=page.locator('a[href*="/collections/edit/home/"]').first();
            if(await edit.count()){await edit.click();await snapshot('home-edit');}
            await page.goto('http://localhost:4321/admin/index.html#/screens/media',{waitUntil:'domcontentloaded'});
            await snapshot('media');
            if(errors.length)throw Error(errors.join('; '));
          }finally{await browser.close();try{process.kill(-child.pid,'SIGTERM');}catch{}}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tina-editor-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: error
