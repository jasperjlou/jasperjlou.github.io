name: One-time Hexo upgrade

on:
  push:
    branches:
      - source
    paths:
      - '.github/workflows/upgrade-hexo.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade Hexo
        run: npm install hexo@^8.1.2 --save

      - name: Verify build
        run: npm run build

      - name: Commit dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Hexo is already up to date."
            exit 0
          fi
          git commit -m "Upgrade Hexo to 8.1.2"
          git push origin HEAD:source
